{% extends "base.html" %}

{% block content %}
<h1>Edit Profile</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="actions">
            <button class="btn" type="submit">Save Changes</button>
            <a class="btn btn-light" href="{% url 'dashboard' %}">Cancel</a>
            <a href="{% url 'delete_profile' %}" class="btn btn-danger">Delete account </a>
        </div>
    </form>
</div>
{% endblock %}
