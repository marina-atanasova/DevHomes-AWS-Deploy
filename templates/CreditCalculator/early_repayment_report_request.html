{% extends "base.html" %}

{% block title %}Generate Early Repayment Report{% endblock %}

{% block content %}
<div class="card">
  <h1>Generate Early Repayment Report</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="row-end mt-14">
      <button type="submit" class="btn btn-primary">Generate report</button>
      <a href="{% url 'CreditCalculator:credit_early_repayment' %}" class="btn btn-muted">Back</a>
    </div>
  </form>
</div>
{% endblock %}
